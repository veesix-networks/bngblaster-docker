name: build-bngblaster

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "BNG Blaster version to build (e.g. 0.9.30)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  check-release:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for new upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/rtbrick/bngblaster/releases/latest --jq '.tag_name')
          LATEST="${LATEST#v}"
          echo "Latest upstream release: ${LATEST}"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

          if git rev-parse "v${LATEST}" >/dev/null 2>&1; then
            echo "Tag v${LATEST} already exists, nothing to do"
            echo "new_version=" >> "$GITHUB_OUTPUT"
          else
            echo "New version found: ${LATEST}"
            echo "new_version=${LATEST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Heartbeat commit (keep schedule alive past 60d)
        run: |
          mkdir -p .github
          {
            echo "last_checked: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream_latest: ${{ steps.check.outputs.latest }}"
          } > .github/upstream-check.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-check.txt
          git commit -m "chore(ci): upstream-check heartbeat (latest=${{ steps.check.outputs.latest }})"
          git push origin HEAD:main

  build-and-push:
    needs: check-release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check-release.outputs.new_version != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ needs.check-release.outputs.new_version }}"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BNGBLASTER_VERSION=${{ steps.version.outputs.version }}
          tags: |
            veesixnetworks/bngblaster:${{ steps.version.outputs.version }}
            veesixnetworks/bngblaster:latest

      - name: Create git tag
        if: steps.version.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.version.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Docker image for [BNG Blaster ${VERSION}](https://github.com/rtbrick/bngblaster/releases/tag/${VERSION}).

          \`\`\`
          docker pull veesixnetworks/bngblaster:${VERSION}
          \`\`\`"
